micronaut:
  application:
    name: backend
  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - "http://localhost:4200"
            - "http://localhost:3000"
            - "http://localhost:8080"
          allowed-methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          allowed-headers:
            - Content-Type
            - Authorization
            - Accept
            - Origin
            - X-Requested-With
    multipart:
      max-file-size: 10MB
  security:
    authentication: bearer
    endpoints:
      login:
        enabled: false
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_GENERATOR_SIGNATURE_SECRET:9f8a8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a}

app:
  upload:
    dir: ${UPLOAD_DIR:uploads/evidencias/}
  models:
    dir: ${MODELS_DIR:models/}
    latest-version: ${MODEL_LATEST_VERSION:1.0.0}
    default-filename: ${MODEL_DEFAULT_FILENAME:light_classifier.tflite}

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    enabled: ${AWS_S3_ENABLED:false}
    bucket-name: ${AWS_S3_BUCKET:descortezadores-evidencias-2026}
    evidencias-prefix: ${AWS_S3_EVIDENCIAS_PREFIX:evidencias/}
    modelos-prefix: ${AWS_S3_MODELOS_PREFIX:modelos/}
    cdn-url: ${AWS_S3_CDN_URL:}

datasources:
  default:
    url: ${DATASOURCES_DEFAULT_URL:${JDBC_URL:jdbc:postgresql://localhost:5432/descortezadores_db}}
    username: ${JDBC_USER:`postgres`}
    password: ${JDBC_PASSWORD:`postgres`}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES
    schema-generate: NONE
