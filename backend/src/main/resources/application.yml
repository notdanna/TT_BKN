micronaut:
  application:
    name: backend
  server:
    port: 8080
    multipart:
      max-file-size: 10MB
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_GENERATOR_SIGNATURE_SECRET:9f8a8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a}

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/descortezadores_db`}
    username: ${JDBC_USER:`postgres`}
    password: ${JDBC_PASSWORD:`postgres`}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES
    schema-generate: NONE

